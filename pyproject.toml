[project]
name = "owl"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
  { name = "diurned", email = "101322926+diurned@users.noreply.github.com" }
]

maintainers = [
  { name = "diurned", email = "101322926+diurned@users.noreply.github.com" }
]
requires-python = ">=3.13"

classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = [
  "ai",
  "llm",
  "agent",
  "autonomous",
  "pentest",
  "redteam",
  "local",
  "rag",
  "mcp"
]

dependencies = [
    # owl
    "typer>=0.27.2",

    # plonk
    "accelerate>=1.15.0",
    "einops>=0.8.2",
    "geoopt>=0.5.1",
    "geos>=0.2.3",
    "hydra-core>=1.3.7",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "pytorch-lightning>=2.6.6",
    "reverse-geocoder>=1.5.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torchdiffeq>=0.2.5",
    "transformers>=5.18.0",
    "wandb>=0.30.0",
    "webdataset>=1.0.2",
    "torchvision>=0.29.1",
    "pillow>=12.3.0",

    # geoclip
    "torch>=2.0,<3",
    "huggingface-hub>=0.20,<2",
    "safetensors>=0.4,<1",
    "geopy>=2.3,<3",
    "tqdm>=4.65,<5",
]

[project.urls]
homepage = "https://github.com/fastiraz/akio"
issues = "https://github.com/Fastiraz/akio/issues"
repository = "https://github.com/fastiraz/akio"
documentation = "https://fastiraz.github.io/grimoire/"

[project.scripts]
owl = "owl.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
